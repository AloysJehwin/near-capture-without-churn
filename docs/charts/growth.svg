<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 252" width="960" height="252" role="img" aria-labelledby="chart-growth-t chart-growth-d" class="chart" id="chart-growth"><title id="chart-growth-t">What multiplied NEAR&#x27;s revenue from Intents</title><desc id="chart-growth-d">Bars on a ratio scale: revenue per day and its three factors, latest 13 weeks against the 13 weeks before the switch.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;fill:#5E4A44}.s{font-size:12px;fill:#7A695D}.b{font-weight:600;fill:#2E0B13}.n{font-variant-numeric:tabular-nums}.h{paint-order:stroke;stroke:#FBF6EA;stroke-width:5px;stroke-linejoin:round}.hit{fill:transparent;stroke:none}</style><rect width="960" height="252" fill="#FBF6EA"/><line x1="250.0" y1="30.0" x2="250.0" y2="206.0" stroke="#E9DFCB" stroke-width="1"/><text x="250.0" y="224.0" text-anchor="middle" class="s n">×0.5</text><line x1="412.5" y1="30.0" x2="412.5" y2="206.0" stroke="#5E4A44" stroke-width="1.2"/><text x="412.5" y="224.0" text-anchor="middle" class="s n">×1</text><line x1="575.0" y1="30.0" x2="575.0" y2="206.0" stroke="#E9DFCB" stroke-width="1"/><text x="575.0" y="224.0" text-anchor="middle" class="s n">×2</text><line x1="737.5" y1="30.0" x2="737.5" y2="206.0" stroke="#E9DFCB" stroke-width="1"/><text x="737.5" y="224.0" text-anchor="middle" class="s n">×4</text><line x1="900.0" y1="30.0" x2="900.0" y2="206.0" stroke="#E9DFCB" stroke-width="1"/><text x="900.0" y="224.0" text-anchor="middle" class="s n">×8</text><path d="M412.5,42.0 H781.0 Q785.0,42.0 785.0,46.0 V58.0 Q785.0,62.0 781.0,62.0 H412.5 Z" fill="#4A0E1C"/><text x="793.0" y="57.0" text-anchor="start" class="b n">×4.90</text><text x="24.0" y="57.0" text-anchor="start" class="b">Revenue per day</text><rect class="hit" x="250.0" y="30.0" width="650.0" height="44.0" data-tip="Revenue per day: ×4.90" tabindex="-1"/><path d="M412.5,86.0 H528.7 Q532.7,86.0 532.7,90.0 V102.0 Q532.7,106.0 528.7,106.0 H412.5 Z" fill="#A8142D"/><text x="540.7" y="101.0" text-anchor="start" class="b n">×1.67</text><text x="24.0" y="101.0" text-anchor="start" class="b">Volume</text><rect class="hit" x="250.0" y="74.0" width="650.0" height="44.0" data-tip="Volume: ×1.67" tabindex="-1"/><path d="M412.5,130.0 H383.6 Q379.6,130.0 379.6,134.0 V146.0 Q379.6,150.0 383.6,150.0 H412.5 Z" fill="#1D6996"/><text x="371.6" y="145.0" text-anchor="end" class="b n">×0.87</text><text x="24.0" y="145.0" text-anchor="start" class="b">Fee rate users pay</text><rect class="hit" x="250.0" y="118.0" width="650.0" height="44.0" data-tip="Fee rate users pay: ×0.87" tabindex="-1"/><path d="M412.5,174.0 H693.7 Q697.7,174.0 697.7,178.0 V190.0 Q697.7,194.0 693.7,194.0 H412.5 Z" fill="#A8142D"/><text x="705.7" y="189.0" text-anchor="start" class="b n">×3.38</text><text x="24.0" y="189.0" text-anchor="start" class="b">Share of fees NEAR keeps</text><rect class="hit" x="250.0" y="162.0" width="650.0" height="44.0" data-tip="Share of fees NEAR keeps: ×3.38" tabindex="-1"/><text x="250.0" y="244.0" text-anchor="start" class="s">Latest 13 weeks divided by the 13 weeks before the switch. Volume × fee rate × share kept = revenue.</text></svg>
